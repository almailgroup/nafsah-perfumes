<!doctype html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Returning Arabic visitors get right-to-left before the first paint,
      // not one English frame later when React mounts. Keep in step with
      // STORAGE_KEY in src/i18n/LocaleProvider.jsx.
      try {
        if (localStorage.getItem('nafsah.lang.v1') === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta
      name="description"
      content="Find your Nafsah fragrance in five questions: Diwaniya, office or wedding, heavy oud or fresh sea air, a Kuwaiti summer or winter nights. اكتشف عطرك من نَفْسَة في خمسة أسئلة."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Scent Finder — Nafsah</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
